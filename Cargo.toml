[package]
name = "borjes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "borjes"
path = "src/main.rs"

[dependencies]
bevy = "0.19"
bevy_egui = "0.40.1"
bevy_panorbit_camera = "0.35"
ignore = "0.4"
libc = "0.2"
open = "5.3.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
# Ya está en el árbol vía bevy_winit; directa solo para WindowLevel en desktop.rs.
winit = "0.30"
