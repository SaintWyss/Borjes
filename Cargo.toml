[package]
name = "borjes"
version = "1.0.0"
edition = "2021"
description = "Navegador visual de carpetas para Linux"
license = "MIT"
repository = "https://github.com/SaintWyss/Borjes"

[[bin]]
name = "borjes"
path = "src/main.rs"

[dependencies]
bevy = "0.19"
bevy_egui = "0.40.1"
bevy_panorbit_camera = "0.35"
ignore = "0.4"
libc = "0.2"
open = "5.3.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
# Ya está en el árbol vía bevy_winit; directa solo para WindowLevel en desktop.rs.
winit = "0.30"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[patch.crates-io]
bevy_image = { path = "vendor/bevy_image" }
